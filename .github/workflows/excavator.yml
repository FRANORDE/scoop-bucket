name: Excavator
permissions:
  contents: write
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # also startable by hand
jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Excavator
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
